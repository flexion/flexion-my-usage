name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on branches, but never cancel a tag/release run.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      # Builds, then fails if dist/ or the npm package would ship test or fixture files.
      - run: yarn check:package

  # Runs the engines.node floor from package.json, which the Node 22 above never reaches.
  # Keep node-version equal to engines.node: the first step after setup-node fails the job when
  # they differ.
  # A separate job on purpose, NOT a matrix on verify: main requires checks named exactly
  # "verify" and "leak-scan", and a matrix would rename verify to "verify (22)" and block every PR.
  # Install, test, then build and smoke-run the entrypoint. tsc and biome (behind yarn typecheck
  # and yarn lint) are native binaries behind a Node launcher, so they give the same result on
  # any Node and verify already covers them - not repeated here. The tests and the built, running
  # entrypoint are what actually execute on the floor.
  verify-node-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
      # Fails fast, before install, when engines.node and the pin above drift apart. It compares the
      # engines.node floor with the Node this job actually runs, so the pin is not written down a
      # third time. It fails closed on anything other than a plain ">=X.Y.Z" range.
      - name: Check node-version matches engines.node
        run: |
          node - <<'EOF'
          const range = require("./package.json").engines?.node;
          const floor =
            typeof range === "string" ? /^>=(\d+\.\d+\.\d+)$/.exec(range)?.[1] : undefined;
          const running = process.versions.node;
          if (floor === undefined) {
            console.log(`::error::engines.node is ${JSON.stringify(range)}, not a plain ">=X.Y.Z" range, so the floor cannot be checked`);
            process.exitCode = 1;
          } else if (floor !== running) {
            console.log(`::error::engines.node floor is ${floor} but this job runs Node ${running}; make node-version in verify-node-floor equal to engines.node`);
            process.exitCode = 1;
          } else {
            console.log(`engines.node floor ${floor} matches the Node this job runs (${running})`);
          }
          EOF
      - run: corepack enable
      - run: yarn install --immutable
      # The coverage gate, on the floor. node:sqlite needs no flag from 22.13.0.
      - run: yarn test
      - run: yarn build
      # Runs the actual built entrypoint on the floor. Nothing above imports src/index.ts (a
      # humble composition root - see vitest.config.ts's coverage.exclude), so the coverage gate
      # never catches an import or syntax issue that only bites on Node 22.13.0. HOME,
      # XDG_DATA_HOME and XDG_CACHE_HOME point at empty temp dirs so this can never see real
      # opencode data or a real price-table cache; with no opencode database found, discover()
      # returns no handles, so price() returns immediately and this step never touches the
      # network. --no-open (myusage-4xu.7) keeps it from spawning a browser. Waits for
      # "Serving at" on stdout (the server is listening), then sends SIGTERM - the same shutdown
      # path Ctrl+C takes in normal use (see server.ts) - and requires a clean exit.
      - name: Smoke-run the built entrypoint on the floor
        run: |
          set -uo pipefail
          home_dir="$(mktemp -d)"
          data_dir="$(mktemp -d)"
          cache_dir="$(mktemp -d)"
          out="$(mktemp)"
          HOME="$home_dir" XDG_DATA_HOME="$data_dir" XDG_CACHE_HOME="$cache_dir" \
            node dist/index.js --no-open >"$out" 2>&1 &
          pid=$!

          ready=0
          for _ in $(seq 1 75); do
            if grep -q "Serving at" "$out"; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 0.2
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::built entrypoint never reported 'Serving at' before exiting"
            cat "$out"
            kill -TERM "$pid" 2>/dev/null || true
            exit 1
          fi

          kill -TERM "$pid"
          if wait "$pid"; then
            status=0
          else
            status=$?
          fi
          cat "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error::built entrypoint exited $status after SIGTERM"
            exit 1
          fi

  # Release runs ONLY on a pushed v* tag. Merging to main never publishes.
  # Flow: bump package.json version in a PR, merge to main, then tag that commit:
  #   git tag vX.Y.Z <merge-sha> && git push origin vX.Y.Z
  # npm publish is gated behind the NPM_PUBLISH_ENABLED repo variable (see RELEASING.md).
  release:
    needs: [verify, verify-node-floor]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm provenance / OIDC Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Not 22 like verify: npm Trusted Publishing (OIDC) needs npm >= 11.5.1, and Node 22
          # bundles npm 10. Node 24 bundles npm 11; the step below fails the release if it doesn't.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Check npm supports Trusted Publishing (>= 11.5.1)
        run: |
          v="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $v is older than 11.5.1, which Trusted Publishing requires"
            exit 1
          fi
          echo "npm $v supports Trusted Publishing"
      - run: corepack enable
      - run: yarn install --immutable
      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi
          echo "Releasing v$pkg_version"
      - run: yarn build
      # No token: npm authenticates this job via OIDC, and attaches provenance automatically.
      # Access is public via publishConfig in package.json (scoped packages default to restricted).
      - name: Publish to npm (OIDC Trusted Publishing)
        if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
        run: npm publish
      - name: Create GitHub Release (auto-generated notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF#refs/tags/}" --generate-notes --verify-tag --latest
