name: Guardrail

# IP-leak backstop for this public repo: secret scan (gitleaks) + internal-term denylist.
# The local pre-commit hook is the primary gate; this catches anything that bypassed it.
# Tracked: myusage-6d9.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          ver=8.30.1
          url="https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Restore internal-term denylist from secret
        env:
          INTERNAL_DENYLIST: ${{ secrets.INTERNAL_DENYLIST }}
        run: |
          mkdir -p .guardrail
          printf '%s\n' "$INTERNAL_DENYLIST" > .guardrail/denylist

      - name: Guardrail scan (secrets + internal terms)
        run: sh scripts/guardrail-scan.sh tree
